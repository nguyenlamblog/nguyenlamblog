<script>
  // Đọc dữ liệu từ localStorage
  function loadHomeData() {
    const saved = localStorage.getItem('concat_data');
    let logs = [
      { date: "01/11/2026", time: "18:56", content: "Hôm nay dòng tiền đổ về ào ạt, két sắt lại nặng thêm kha khá rồi! Có 21 đơn mới, thêm 6.733.000đ doanh thu." },
      { date: "01/11/2026", time: "14:01", content: "Vừa nổ thêm mấy đơn, dòng tiền lại rủng rỉnh chảy vào túi tôi rồi nhé! Có 15 đơn mới, thêm 4.776.000đ doanh thu." }
    ];

    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.logs && parsed.logs.length > 0) {
        logs = parsed.logs;
      }
    }

    // Render ra danh sách Nhật ký
    const container = document.getElementById('logsContainer');
    if (container) {
      container.innerHTML = logs.map(log => `
        <article class="entry">
          <time>${log.time}</time>
          <p><strong>[${log.date}]</strong> ${log.content}</p>
        </article>
      `).join('');
    }
  }

  // Tải dữ liệu khi mở trang
  loadHomeData();

  // Lắng nghe thay đổi nếu bạn mở 2 tab cùng lúc (1 tab Admin, 1 tab Trang chủ)
  window.addEventListener('storage', loadHomeData);
</script>
