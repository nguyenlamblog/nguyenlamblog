<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConCat Admin — Quản Trị Nhật Ký</title>
<style>
  :root { --bg: #f7f5f0; --paper: #fff; --border: #e9e2d7; --ink: #171717; --green: #208252; --red: #c5221f; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Arial, sans-serif; padding: 20px; }
  main { max-width: 800px; margin: 0 auto; }
  .card { background: var(--paper); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  h1, h2 { margin-top: 0; }
  .form-group { margin-bottom: 15px; }
  label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
  textarea { width: 100%; height: 90px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; resize: vertical; }
  .btn { background: var(--green); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .btn-danger { background: var(--red); padding: 5px 10px; font-size: 12px; border-radius: 6px; color: white; border: none; cursor: pointer; }
  .log-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .log-item:last-child { border-bottom: 0; }
  .nav-link { display: inline-block; margin-bottom: 15px; color: var(--green); text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<main>
  <a href="index.html" class="nav-link">← Quay lại Trang Chủ (ConCat)</a>
  <h1>Quản Trị Hệ Thống ConCat</h1>

  <!-- FORM THÊM NHẬT KÝ -->
  <div class="card">
    <h2>+ Đăng Nhật Ký Mới</h2>
    <form id="adminLogForm">
      <div class="form-group">
        <label>Nội dung nhật ký AI</label>
        <textarea id="logContent" placeholder="Nhập nội dung thông báo, kết quả chạy ads..." required></textarea>
      </div>
      <button type="submit" class="btn">Đăng Bài Ngay</button>
    </form>
  </div>

  <!-- DANH SÁCH QUẢN LÝ -->
  <div class="card">
    <h2>Danh Sách Nhật Ký Hiện Có</h2>
    <div id="adminLogList"></div>
  </div>
</main>

<script>
  const emptyData = {
    capital: 0,
    products: [],
    logs: [],
    views: { online: 0, today: 0, total: 0 }
  };

  function getData() {
    const saved = localStorage.getItem('concat_local_db');
    return saved ? JSON.parse(saved) : emptyData;
  }

  function saveData(data) {
    localStorage.setItem('concat_local_db', JSON.stringify(data));
    renderAdmin();
  }

  function renderAdmin() {
    const data = getData();
    const listEl = document.getElementById('adminLogList');
    
    if (!data.logs || data.logs.length === 0) {
      listEl.innerHTML = '<p style="color:#888">Chưa có nhật ký nào.</p>';
      return;
    }

    listEl.innerHTML = data.logs.map((log, index) => `
      <div class="log-item">
        <div>
          <div style="font-size: 12px; color: #786f66; margin-bottom: 4px;">⏰ ${log.time} — ${log.date}</div>
          <div>${log.content}</div>
        </div>
        <button class="btn-danger" onclick="deleteLog(${index})">Xóa</button>
      </div>
    `).join('');
  }

  document.getElementById('adminLogForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const txt = document.getElementById('logContent').value.trim();
    if (!txt) return;

    const data = getData();
    if (!data.logs) data.logs = [];

    const now = new Date();
    data.logs.unshift({
      id: Date.now(),
      date: now.toLocaleDateString('vi-VN'),
      time: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
      content: txt
    });

    saveData(data);
    document.getElementById('logContent').value = '';
    alert('Đăng nhật ký thành công!');
  });

  window.deleteLog = function(index) {
    if (confirm('Bạn có chắc muốn xóa bản ghi này?')) {
      const data = getData();
      data.logs.splice(index, 1);
      saveData(data);
    }
  };

  renderAdmin();
</script>
</body>
</html>
