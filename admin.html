<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConCat Admin — Nhập Dữ Liệu Chạy Uber</title>
<style>
  :root { --bg: #f7f5f0; --paper: #fff; --border: #e9e2d7; --ink: #171717; --green: #208252; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Arial, sans-serif; padding: 20px; }
  main { max-width: 650px; margin: 0 auto; }
  .card { background: var(--paper); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  h1, h2 { margin-top: 0; }
  .form-group { margin-bottom: 15px; }
  label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
  input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
  textarea { height: 90px; resize: vertical; }
  .btn { background: var(--green); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
  .btn:disabled { background: #ccc; }
  .nav-link { display: inline-block; margin-bottom: 15px; color: var(--green); text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<main>
  <a href="index.html" class="nav-link">← Xem Trang Chủ Uber (index.html)</a>
  <h1>Quản Trị Thu Nhập Uber</h1>

  <!-- FORM 1: THÊM NHẬT KÝ -->
  <div class="card">
    <h2>1. Thêm Nhật KÝ Ca Chạy</h2>
    <form id="logForm">
      <div class="form-group">
        <label>Nội dung nhật ký ca chạy</label>
        <textarea id="logContent" placeholder="VD: Hôm nay chạy ca tối nổ 10 cuốc, thời tiết đẹp..." required></textarea>
      </div>
      <button type="submit" class="btn" id="btnLog">Gửi Lên Google Sheet</button>
    </form>
  </div>

  <!-- FORM 2: THÊM CA CHẠY / DỊCH VỤ -->
  <div class="card">
    <h2>2. Thêm Ca Chạy / Dịch Vụ Mới</h2>
    <form id="prodForm">
      <div class="form-group">
        <label>Dịch vụ / Ca chạy</label>
        <input type="text" id="pName" placeholder="VD: Uber Eats Sáng 02/11" required>
      </div>
      <div class="form-group">
        <label>Chi phí xăng / xe (VNĐ)</label>
        <input type="number" id="pSpend" value="0" required>
      </div>
      <div class="form-group">
        <label>Thu nhập TB/chuyến (VNĐ)</label>
        <input type="number" id="pPrice" value="0" required>
      </div>
      <div class="form-group">
        <label>Số chuyến / đơn hoàn thành</label>
        <input type="number" id="pOrders" value="0" required>
      </div>
      <div class="form-group">
        <label>Trạng thái</label>
        <select id="pStatus">
          <option value="Hoàn thành">Hoàn thành</option>
          <option value="Tạm nghỉ">Tạm nghỉ</option>
        </select>
      </div>
      <button type="submit" class="btn" id="btnProd">Lưu Ca Chạy Lên Sheet</button>
    </form>
  </div>
</main>

<script>
  // DÁN URL GOOGLE APPS SCRIPT WEB APP CỦA BẠN VÀO ĐÂY:
  const API_URL = "URL_WEB_APP_CUA_BAN";

  document.getElementById('logForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLog');
    btn.disabled = true;
    btn.textContent = "Đang lưu...";

    const now = new Date();
    const payload = {
      type: "add_log",
      date: now.toLocaleDateString('vi-VN'),
      time: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
      content: document.getElementById('logContent').value.trim()
    };

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      alert("Đã lưu nhật ký Uber thành công!");
      document.getElementById('logContent').value = "";
    } catch (err) {
      alert("Lỗi: " + err);
    } finally {
      btn.disabled = false;
      btn.textContent = "Gửi Lên Google Sheet";
    }
  });

  document.getElementById('prodForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnProd');
    btn.disabled = true;
    btn.textContent = "Đang lưu...";

    const payload = {
      type: "add_product",
      name: document.getElementById('pName').value.trim(),
      spend: Number(document.getElementById('pSpend').value),
      price: Number(document.getElementById('pPrice').value),
      orders: Number(document.getElementById('pOrders').value),
      status: document.getElementById('pStatus').value
    };

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      alert("Đã lưu ca chạy Uber thành công!");
      document.getElementById('pName').value = "";
    } catch (err) {
      alert("Lỗi: " + err);
    } finally {
      btn.disabled = false;
      btn.textContent = "Lưu Ca Chạy Lên Sheet";
    }
  });
</script>
</body>
</html>
